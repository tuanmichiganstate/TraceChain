<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TraceChain - mo phong truy xuat chuoi cung ung bang blockchain" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <!--
      No external origin is permitted. The package must run inside a Moodle
      SCORM activity with no network connection after loading, so every script,
      style, font and image is bundled.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'"
    />
    <!-- frame-ancestors is intentionally omitted: browsers ignore it in a
         meta policy, and the Moodle host must be allowed to embed this SCO. -->
    <title>TraceChain</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
