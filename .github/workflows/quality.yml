name: quality

# The authoritative gate. scripts/hooks/pre-commit is a local early warning that
# a fresh clone does not run and `--no-verify` bypasses; this is the check that
# cannot be skipped by forgetting something.
#
# WHY THE BRANCH FILTERS
# ----------------------
# Both events were previously unfiltered, so every push to a branch with an open
# pull request started two identical runs of the same commit -- verified across
# four commits on PR #1, each carrying a `push` run and a `pull_request` run of
# the same SHA. Filtering `push` to master leaves exactly one trigger per case:
#
#   feature branch with an open PR  ->  pull_request only
#   push or merge to master         ->  push only
#
# A feature branch with no PR open yet gets no run. That is the deliberate cost
# of the model: scripts/hooks/pre-commit runs the same gate locally, and the
# work is checked here the moment a pull request exists.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Full Safari-family acceptance at 01:00 Vietnam time.
  schedule:
    - cron: '0 18 * * *'
  # Manual runs also execute the full browser matrix before a release.
  workflow_dispatch:

# One run per pull request, or per ref outside one. Superseded runs are
# cancelled, which matters most for the slow full browser matrix.
#
# Master is deliberately excluded from cancellation. A cancelled run there would
# leave the branch with no verdict, and on master a missing answer is too easily
# mistaken for a passing one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    # Measured at roughly 100s; this only bounds a hang.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # lint, typecheck, unit/component, locale audit, scenario validation,
      # content-review parity, build, SCORM package build and verification.
      - name: Quality gate
        run: npm run quality

  # Fast browser coverage on every push, pull request, schedule and manual run.
  #
  # The runner is 2-core/7GB, so Playwright's ceil(cores/2) default gives a
  # single worker and the whole suite runs serially. Two workers on one runner
  # was measured and was worse on both counts -- slower and flaky, browsers
  # starving each other. Parallelism therefore has to come from more runners
  # rather than more workers per runner. Chromium and Firefox catch ordinary
  # integration regressions in roughly two minutes. The slower Safari-family
  # acceptance jobs run nightly or manually below.
  browser:
    strategy:
      # Every browser reports its own verdict. Stopping the others on the first
      # failure would hide whether a break is engine-specific, which is most of
      # what this suite exists to answer.
      fail-fast: false
      matrix:
        include:
          - name: chromium
            tier: fast
            project: chromium
            browser: chromium
            shard: 1/1
          - name: firefox
            tier: fast
            project: firefox
            browser: firefox
            shard: 1/1
    name: browser (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # Playwright takes its worker count from the core count, so recording the
      # runner's size makes the length of this job self-explaining instead of
      # something to go and measure again later.
      - name: Runner size
        run: echo "cores=$(nproc) memory=$(free -g | awk '/^Mem:/{print $2}')GB"

      # The e2e suite runs against dist/ -- the artefact that actually ships --
      # and `vite preview` serves exactly that directory. Without this the web
      # server has nothing to serve and Playwright times out waiting for it.
      - run: npm run build

      # Browsers are deliberately not cached. Most of this step is apt
      # installing system libraries, which a browser cache cannot hold, and the
      # downloads are a small fraction of a job dominated by test execution.
      - run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: End-to-end
        run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          # Unique per project so parallel failures cannot collide.
          name: playwright-report-${{ matrix.name }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          # `warn`, not `error`. A job that dies before Playwright runs -- a bad
          # install, a failed build -- produces no report directory, and failing
          # the upload there replaces the real cause with an artifact error and
          # uploads nothing. Observed exactly that during a deliberate failure.
          if-no-files-found: warn

  # Safari-family acceptance runs nightly and whenever this workflow is started
  # manually. A commit-count cadence would need external state and leave unclear
  # which commit has the complete browser verdict.
  safari:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: webkit-1-of-2
            tier: full
            project: webkit
            browser: webkit
            shard: 1/2
          - name: webkit-2-of-2
            tier: full
            project: webkit
            browser: webkit
            shard: 2/2
          - name: mobile-safari
            tier: full
            project: mobile-safari
            browser: webkit
            shard: 1/1
    name: safari (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Runner size
        run: echo "cores=$(nproc) memory=$(free -g | awk '/^Mem:/{print $2}')GB"

      - run: npm run build

      - run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: End-to-end
        run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.name }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: warn

  # A single stable verdict for the fast browser matrix.
  #
  # Matrix jobs are named per project, so anything that wants one name to depend
  # on -- a required check, a reviewer skimming the list -- would otherwise have
  # to track jobs that change whenever a project is added. This runs no tests;
  # it reports whether Chromium and Firefox both passed.
  e2e:
    needs: browser
    timeout-minutes: 5
    # Deliberately `!cancelled()` rather than `always()`. Both keep evaluating
    # after an upstream failure, which is the point; `always()` would also run
    # when the whole workflow is cancelled, turning every superseded run red and
    # making a busy pull request look broken. `needs.browser.result` is the
    # aggregate over all matrix entries, so anything other than `success` --
    # failure, a cancelled or skipped child, a job that timed out or died during
    # setup -- fails the step below.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every browser project to have passed
        run: |
          echo "browser matrix result: ${{ needs.browser.result }}"
          test "${{ needs.browser.result }}" = "success"

  # A stable complete-browser verdict for nightly and pre-release manual runs.
  full-e2e:
    needs: [browser, safari]
    timeout-minutes: 5
    if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every browser project to have passed
        run: |
          echo "fast browser matrix result: ${{ needs.browser.result }}"
          echo "Safari-family matrix result: ${{ needs.safari.result }}"
          test "${{ needs.browser.result }}" = "success"
          test "${{ needs.safari.result }}" = "success"
