name: quality

# The authoritative gate. scripts/hooks/pre-commit is a local early warning that
# a fresh clone does not run and `--no-verify` bypasses; this is the check that
# cannot be skipped by forgetting something.
on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # lint, typecheck, unit/component, locale audit, scenario validation,
      # content-review parity, build, SCORM package build and verification.
      - name: Quality gate
        run: npm run quality

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # Chromium, Firefox, WebKit and the iPhone SE profile. Browsers are a
      # large download, so this is a separate job rather than serialised behind
      # the gate above.
      - run: npx playwright install --with-deps

      - name: End-to-end
        run: npx playwright test

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
